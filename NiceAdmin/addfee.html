<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Add New Fee</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="assets/img/logo.jpg" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/vendor/quill/quill.snow.css" rel="stylesheet">
  <link href="assets/vendor/quill/quill.bubble.css" rel="stylesheet">
  <link href="assets/vendor/remixicon/remixicon.css" rel="stylesheet">
  <link href="assets/vendor/simple-datatables/style.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="assets/css/style.css" rel="stylesheet">

</head>

<body>

  <main>
    <div class="container">

      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 d-flex flex-column align-items-center justify-content-center">

              <div class="d-flex justify-content-center py-4">
                <a href="index.html" class="logo d-flex align-items-center w-auto">
                  <img src="assets/img/logo.jpg" alt="">
                  <span class="d-none d-lg-block">GateHub</span>
                </a>
              </div><!-- End Logo -->

              <div class="card mb-3">

                <div class="card-body">

                  <div class="pt-4 pb-2">
                    <h5 class="card-title text-center pb-0 fs-4">Add New Fee</h5>
                    <p class="text-center small">Enter fee details for the gate</p>
                     <div id="alertContainer" class="mt-3">
    <!-- Success and error alerts will be inserted here -->
  </div>
                  </div>

                  <form class="row g-3 needs-validation" id="addFeeForm" novalidate>
                    <div class="col-12">
                      <label for="gateId" class="form-label">Gate ID</label>
                      <input type="number" name="gateId" class="form-control" id="gateId" required>
                      <div class="invalid-feedback">Please enter the Gate ID.</div>
                    </div>

                    <div class="col-12">
                      <label for="vehicleType" class="form-label">Vehicle Type</label>
                      <select class="form-select" name="vehicleType" id="vehicleType" required>
                        <option value="" selected disabled>Select vehicle type</option>
                        <option value="ملاكي">ملاكي</option>
                        <option value="أجرة">أجرة</option>
                      </select>
                      <div class="invalid-feedback">Please select a vehicle type.</div>
                    </div>

                    <div class="col-12">
                      <label for="fee" class="form-label">Fee Amount</label>
                      <input type="number" name="fee" class="form-control" id="fee" required>
                      <div class="invalid-feedback">Please enter the fee amount.</div>
                    </div>

                    <div class="col-12">
                      <button class="btn btn-primary w-100" type="submit">Add Fee</button>
                    </div>
                  </form>

                </div>
              </div>

              <div class="credits">
               </div>

            </div>
          </div>
        </div>

      </section>

    </div>
  </main><!-- End #main -->

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  <!-- Template Main JS File -->
  <script src="assets/js/main.js"></script>
<script>
  (() => {
    'use strict'
    const form = document.getElementById('addFeeForm')
    const alertContainer = document.getElementById('alertContainer')

    const showAlert = (message, type = 'success') => {
      const alert = document.createElement('div')
      alert.className = `alert alert-${type} alert-dismissible fade show`
      alert.role = 'alert'
      alert.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      `
      alertContainer.innerHTML = ''
      alertContainer.appendChild(alert)
      
      setTimeout(() => {
        alert.remove()
      }, 5000)
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      event.stopPropagation()
      alertContainer.innerHTML = ''

      // Token handling
      let token;
      try {
        const tokenString = localStorage.getItem('token')
        if (!tokenString) {
          window.location.href = 'login.html'
          return
        }

        const tokenObj = JSON.parse(tokenString)
        token = tokenObj?.result || tokenObj?.token || tokenObj
        
        if (!token || typeof token !== 'string' || !token.startsWith('eyJ')) {
          localStorage.removeItem('token')
          window.location.href = 'pages-login.html'
          return
        }
      } catch (e) {
        console.error("Token error:", e)
        localStorage.removeItem('token')
        window.location.href = 'pages-login.html'
        return
      }

      if (form.checkValidity()) {
        const formData = {
          gateId: parseInt(document.getElementById('gateId').value),
          vehicleType: document.getElementById('vehicleType').value,
          fee: parseFloat(document.getElementById('fee').value)
        }

        try {
          const response = await fetch('http://gatehub.runasp.net/api/Admin/AddFee', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(formData)
          })

          const responseText = await response.text()
          
          if (!response.ok) {
            try {
              const errorData = JSON.parse(responseText)
              showAlert(errorData.message || 'Failed to add fee', 'danger')
            } catch {
              showAlert(`Error: ${response.statusText}`, 'danger')
            }
            if (response.status === 401) {
              localStorage.removeItem('token')
              window.location.href = 'pages-login.html'
            }
            return
          }

          showAlert('Fee added successfully!', 'success')
          form.reset()
          form.classList.remove('was-validated')

        } catch (error) {
          showAlert('Network error occurred. Please try again.', 'danger')
          console.error('Fetch error:', error)
          if (error.message.includes('401')) {
            localStorage.removeItem('token')
            window.location.href = 'pages-login.html'
          }
        }
      }
      
      form.classList.add('was-validated')
    }, false)
  })()
</script>
</body>

</html>
