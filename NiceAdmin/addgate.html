<body>

  <main>
    <div class="container">

      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 d-flex flex-column align-items-center justify-content-center">

              <div class="d-flex justify-content-center py-4">
                <a href="index.html" class="logo d-flex align-items-center w-auto">
                  <img src="assets/img/logo.jpg" alt="">
                  <span class="d-none d-lg-block">GateHub</span>
                </a>
              </div><!-- End Logo -->

              <div class="card mb-3">

                <div class="card-body">

                  <div class="pt-4 pb-2">
                    <h5 class="card-title text-center pb-0 fs-4">Add New Gate </h5>
                    <p class="text-center small">Enter the details to add a new gate  </p>
                  </div>

                  <form class="row g-3 needs-validation" id="addGateForm" class="needs-validation"  novalidate >
                    <div class="col-12">
                      <label for="type" class="form-label">Gate type</label>
                      <input type="text" name="type" class="form-control" id="type" required>
                      <div class="invalid-feedback">Please enter the Gate type.</div>
                    </div>

                    <div class="col-12">
                      <label for="addressName" class="form-label">Adress</label>
                      <input type="Adress" name="Adress" class="form-control" id="addressName" required>
                      <div class="invalid-feedback">Please enter a valid adress .</div>
                    </div>

                    <div class="col-12">
                      <label for="addressCity" class="form-label">city</label>
                      <input type="text" name="city" class="form-control" id="addressCity" required>
                      <div class="invalid-feedback">Please enter the city.</div>
                    </div>

                    <div class="col-12">
                      <label for="addressGovernment" class="form-label">Government Gate</label>
                      <input type="text" name="gate" class="form-control" id="addressGovernment" required>
                      <div class="invalid-feedback">Please enter the Government.</div>
                    </div>

                    <div class="col-12">
                      <button class="btn btn-primary w-100" type="submit">Add a Gate </button>
                    </div>
                  </form>

                </div>
              </div>

              <div class="credits">
               </div>

            </div>
          </div>
        </div>

      </section>

    </div>

  <script src="assets/vendor/tinymce/tinymce.min.js"></script>
  <script src="assets/vendor/php-email-form/validate.js"></script>

  <!-- Template Main JS File -->
  <script src="assets/js/main.js"></script>
  <script>
        document.addEventListener('DOMContentLoaded', async () => {
   /// 1. Retrieve token with proper checks
            const tokenString = localStorage.getItem('token');

            if (!tokenString) {
                console.error("No token found - redirecting to login");
                window.location.href = 'login.html';
                return;
            }

            // 2. Parse with error handling
            let tokenObj;
            try {
                tokenObj = JSON.parse(tokenString);
            } catch (e) {
                console.error("Failed to parse token:", e);
                localStorage.removeItem('token');
                window.location.href = 'pages-login.html';
                return;
            }

            // 3. Extract the actual token with validation
        token = tokenObj?.result || tokenObj?.token || tokenObj;     
            
            if (!token || typeof token !== 'string' || !token.startsWith('eyJ')) {
                console.error("Invalid token format:", token);
                localStorage.removeItem('token');
                window.location.href = 'pages-login.html';
                return;
            }

            console.log("Token verified:", token.slice(0, 20) + "..."); // Log partial token
    });










    document.getElementById('addGateForm').addEventListener('submit', async (event) => {
      event.preventDefault(); // Prevent default form submission
  
      // Collect form data
      const gateData = {
        type: document.getElementById('type').value,
        addressName: document.getElementById('addressName').value,
        addressCity: document.getElementById('addressCity').value,
        addressGovernment: document.getElementById('addressGovernment').value,
      };
  
      try {
        const response = await fetch('http://gatehub.runasp.net/api/Admin/add-gate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(gateData),
        });
  
        if (!response.ok) {
          const errorDetails = await response.json();
          console.error('Error details:', errorDetails);
          throw new Error(`Failed to add gate: ${response.status}`);
        }
  
        const result = await response.json();
        alert('Gate added successfully!');
        console.log(result);
        // Optionally clear the form
        document.getElementById('addGateForm').reset();
      } catch (error) {
        console.error('Error adding gate:', error.message);
        // alert('Failed to add gate. Please try again.');
      }
    });
  </script>
  
</body>

</html>
