<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Add Lost Vehicle</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="assets/img/logo.jpg" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="assets/css/style.css" rel="stylesheet">

</head>

<body>

  <main>
    <div class="container">
      <section class="section add-lost-vehicle min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">

              <!-- Page Title -->
              <div class="d-flex justify-content-between align-items-center pb-4">
                <h2 class="page-title">Add Lost Vehicle</h2>
                <a href="lostvehicleinquiry.html" class="btn btn-secondary">Back to Lost Vehicle Inquiry</a>
              </div>

              <!-- Add Lost Vehicle Form -->
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">Enter Vehicle Details</h5>

                  <form class="row g-3 needs-validation" novalidate>
                    <div class="col-12">
                      <label for="licensePlate" class="form-label">License Plate</label>
                      <input type="text" name="licensePlate" class="form-control" id="licensePlate" placeholder="Enter License Plate" >
                      <!-- <div class="invalid-feedback">License plate must be alphanumeric and 1-10 characters long.</div> -->
                    </div>
                    
                    <div class="col-12">
                      <label for="reportedDate" class="form-label">Reported Date</label>
                      <input type="date" name="reportedDate" class="form-control" id="reportedDate" required>
                      <div class="invalid-feedback">Please select the reported date.</div>
                    </div>

                  
                    <button class="btn btn-primary w-100" type="submit" id="submitBtn">
                      Add Lost Vehicle
                    </button>
                  </form>
                </div>
              </div>
              <!-- End Add Lost Vehicle Form -->
              <div id="loading" class="text-center mb-3" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main><!-- End #main -->

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    // 1. Token Handling and Validation
    let authToken;
    try {
        const tokenString = localStorage.getItem('token');
        if (!tokenString) {
            window.location.href = 'pages-login.html';
            return;
        }

        // Handle token format
        try {
            const tokenObj = JSON.parse(tokenString);
            authToken = tokenObj?.result || tokenObj?.token || tokenObj;
        } catch {
            authToken = tokenString;
        }

        if (!authToken || typeof authToken !== 'string') {
            throw new Error('Invalid token format');
        }
        console.log("Token verified:", authToken.slice(0, 20) + "...");
    } catch (error) {
        console.error("Authentication error:", error);
        localStorage.removeItem('token');
        window.location.href = 'pages-login.html';
        return;
    }

    // 2. Form Handling
    const form = document.querySelector("form");
    const loading = document.getElementById('loading');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        let isValid = true;

        // Clear previous validation
        form.classList.remove('was-validated');
        document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));

        // Form Elements
        const licensePlate = document.getElementById("licensePlate");
        const reportedDate = document.getElementById("reportedDate");

        // Validation Checks
        // License Plate Validation
        const licensePlateRegex = /^[A-Z0-9-]{1,20}$/i; // Adjusted to match API requirements
        if (!licensePlateRegex.test(licensePlate.value)) {
            licensePlate.classList.add("is-invalid");
            isValid = false;
        }

        // Date Validation
        if (!reportedDate.value) {
            reportedDate.classList.add("is-invalid");
            isValid = false;
        }

        if (!isValid) {
            event.stopPropagation();
            form.classList.add('was-validated');
            return;
        }

        try {
            // Show loading state
            loading.style.display = 'block';
            submitBtn.disabled = true;

            const response = await fetch('http://gatehub.runasp.net/api/Admin/AddLostVehicle', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({
                    reportedDate: reportedDate.value,
                    isFound: false, // Default to false for new entries
                    plateNumber: licensePlate.value.trim().toUpperCase()
                })
            });

            const responseText = await response.text();
            
            if (!response.ok) {
                if (response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = 'pages-login.html';
                    return;
                }
                
                try {
                    const errorData = JSON.parse(responseText);
                    throw new Error(errorData.message || 'Failed to add lost vehicle');
                } catch {
                    throw new Error(`Server error: ${response.status} - ${responseText}`);
                }
            }

            // Clear form on success
            form.reset();
            alert('Lost vehicle added successfully!');

        } catch (error) {
            console.error('Submission error:', error);
            alert(`Error: ${error.message}`);
        } finally {
            loading.style.display = 'none';
            submitBtn.disabled = false;
        }
    });
});
</script>
  
  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>

</body>

</html>
