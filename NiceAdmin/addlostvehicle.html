<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Add Lost Vehicle</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="assets/img/logo.jpg" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="assets/css/style.css" rel="stylesheet">

</head>

<body>

  <main>
    <div class="container">
      <section class="section add-lost-vehicle min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">

              <!-- Page Title -->
              <div class="d-flex justify-content-between align-items-center pb-4">
                <h2 class="page-title">Add Lost Vehicle</h2>
                <a href="lostvehicleinquiry.html" class="btn btn-secondary">Back to Lost Vehicle Inquiry</a>
              </div>

              <!-- Add Lost Vehicle Form -->
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">Enter Vehicle Details</h5>

                  <form class="row g-3 needs-validation" novalidate>
                    <div class="col-12">
                      <label for="licensePlate" class="form-label">License Plate</label>
                      <input type="text" name="licensePlate" class="form-control" id="licensePlate" placeholder="Enter License Plate" >
                      <!-- <div class="invalid-feedback">License plate must be alphanumeric and 1-10 characters long.</div> -->
                    </div>
                    
                    <div class="col-12">
                      <label for="reportedDate" class="form-label">Reported Date</label>
                      <input type="date" name="reportedDate" class="form-control" id="reportedDate" required>
                      <div class="invalid-feedback">Please select the reported date.</div>
                    </div>

                  
                    <button class="btn btn-primary w-100" type="submit" id="submitBtn">
                      Add Lost Vehicle
                    </button>
                  </form>
                </div>
              </div>
              <!-- End Add Lost Vehicle Form -->
              <div id="loading" class="text-center mb-3" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main><!-- End #main -->

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector("form");
      
      form.addEventListener("submit", (event) => {
        let isValid = true;
  
        // License Plate Validation
        const licensePlate = document.getElementById("licensePlate");
        const licensePlateRegex = /^[A-Z0-9-]{1,10}$/; // Example format
        if (!licensePlateRegex.test(licensePlate.value)) {
          licensePlate.classList.add("is-invalid");
          isValid = false;
        } else {
          licensePlate.classList.remove("is-invalid");
        }
  
        // Vehicle Type Validation
        const vehicleType = document.getElementById("vehicleType");
      
  
        // Last Seen Location Validation
        const lastSeenLocation = document.getElementById("lastSeenLocation");
        if (lastSeenLocation.value.trim() === "") {
          lastSeenLocation.classList.add("is-invalid");
          isValid = false;
        } else {
          lastSeenLocation.classList.remove("is-invalid");
        }
  
        // Reported Date Validation
        const reportedDate = document.getElementById("reportedDate");
        if (!reportedDate.value) {
          reportedDate.classList.add("is-invalid");
          isValid = false;
        } else {
          reportedDate.classList.remove("is-invalid");
        }
  
        // Prevent submission if any field is invalid
        if (!isValid) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector("form");
      
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        let isValid = true;
    
        // Clear previous validation
        form.classList.remove('was-validated');
        document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
    
        // License Plate Validation
        const licensePlate = document.getElementById("licensePlate");
        const licensePlateValue = licensePlate.value;
        // const licensePlateRegex = /^[A-Z0-9-]{1,10}$/i; // Case-insensitive check
       
    
        // Reported Date Validation
        const reportedDate = document.getElementById("reportedDate");
        const reportedDateValue = reportedDate.value;
        if (!reportedDateValue) {
          reportedDate.classList.add("is-invalid");
          isValid = false;
        }
    
        if (!isValid) {
          event.stopPropagation();
          form.classList.add('was-validated');
          return;
        }
    
        try {
          document.getElementById('loading').style.display = 'block';
document.getElementById('submitBtn').disabled = true;
          const response = await fetch('http://gatehub.runasp.net/api/Admin/AddLostVehicle', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              reportedDate: reportedDateValue,
              isFound: false, // Hardcoded as per requirements
              plateNumber: licensePlateValue
            })
          });
    
          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || 'Failed to add lost vehicle');
          }
    
          // Clear form on success
          form.reset();
          alert('Lost vehicle added successfully!');
          
        } catch (error) {
          console.error('Submission error:', error);
          alert(`Error: ${error.message}`);
        }
        finally {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('submitBtn').disabled = false;
}
      });
    });
    </script>
  
  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>

</body>

</html>
