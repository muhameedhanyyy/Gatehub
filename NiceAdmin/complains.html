  <style>
    .custom-btn {
  background-color: #3498db; /* Replace with your website's primary color */
  border: none;
  color: white;
  padding: 0.4rem 0.8rem;

<body>

  <main>
    <div class="container">

      <section class="section complains min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-10 col-md-12">

              <!-- Logo -->
              <div class="d-flex justify-content-center py-4">
                <a href="index.html" class="logo d-flex align-items-center w-auto">
                  <img src="assets/img/logo.jpg" alt="GateHub Logo" style="max-height: 60px;">
                  <span class="ms-2 fw-bold fs-4 text-primary">GateHub</span>
                </a>
              </div>
              <!-- End Logo -->

              <!-- Page Title -->
              <div class="d-flex justify-content-between align-items-center py-4">
                <h2 class="page-title">Complains</h2>
              </div>

              <!-- Complains Table -->
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">Complain Records</h5>
                  <table class="table table-bordered">
                    <thead>
                      <tr>
                        <th scope="col">Status</th>
                        <th scope="col">Date</th>
                        <th scope="col">description</th>
                        <th scope="col">vehicleOwnerName</th>
                        <th scope="col">plateNum</th>
                        <th scope="col">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="complaintsTableBody">
                      <!-- Sample Complains -->
                    
                    </tbody>
                  </table>
                </div>
              </div>
              <!-- End Complains Table -->
              <div id="loading" class="text-center my-4">
                Loading complaints...
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main><!-- End #main -->

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
   <!-- Add this before main.js -->
<script src="https://cdn.tiny.cloud/1/your-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/simple-datatables/simple-datatables.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    // Function to load complaints from API
    async function loadComplaints() {
      // In your loadComplaints function
const loading = document.getElementById('loading');
loading.style.display = 'none'; // Hide after loading
      try {
        const response = await fetch('http://gatehub.runasp.net/api/Admin/Objections');
        const objections = await response.json();
        console.log('API Response:', objections); // Add this before processing


        const tbody = document.getElementById('complaintsTableBody');
        tbody.innerHTML = ''; // Clear existing rows

        objections.forEach(objection => {
          const row = document.createElement('tr');
          
          // Map API response to table columns
          row.innerHTML = `
      <td>
            <span class="badge ${getStatusClass(objection.statue)}">
              ${objection.statue || 'Unknown'}
            </span>
          </td>   
          <td>${new Date(objection.date).toLocaleDateString()}</td>
          <td>${objection.description }</td>
          <td>${objection.vehicleOwnerName }</td>
          <td>${objection.plateNum }</td>
    
    <td>
      <button class="btn btn-sm custom-btn" 
              onclick="window.location.href='complaindetails.html?id=${objection.id}'">
        View Details
      </button>
    </td>
  `;

  tbody.appendChild(row);
        });

        // Initialize SimpleDatatables
        new simpleDatatables.DataTable('.table');

      } catch (error) {
        console.error('Error loading complaints:', error);
      }
    }

    // Helper function to determine status badge class
    function getStatusClass(status) {
  const statusValue = status?.toLowerCase()?.trim() || 'unknown';
  
  switch (statusValue) {
    case 'pending': return 'bg-warning';
    case 'resolved': return 'bg-success';
    case 'rejected': return 'bg-danger';
    default: return 'bg-secondary';
  }
}
    // Load complaints when page loads
    window.onload = loadComplaints;
  </script>
</body>

</html>
