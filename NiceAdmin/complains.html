  <script>

    // Fetch objections data
    async function fetchObjections() {
        try {
            /// 1. Retrieve token with proper checks
            const tokenString = localStorage.getItem('token');

            if (!tokenString) {
                console.error("No token found - redirecting to login");
                window.location.href = 'pages-login.html';
                return;
            }

            // 2. Parse with error handling
            let tokenObj;
            try {
                tokenObj = JSON.parse(tokenString);
            } catch (e) {
                console.error("Failed to parse token:", e);
                localStorage.removeItem('token');
                window.location.href = 'pages-login.html';
                return;
            }

            // 3. Extract the actual token with validation
        token = tokenObj?.result || tokenObj?.token || tokenObj;     
            
            if (!token || typeof token !== 'string' || !token.startsWith('eyJ')) {
                console.error("Invalid token format:", token);
                localStorage.removeItem('token');
                window.location.href = 'pages-login.html';
                return;
            }

            console.log("Token verified:", token.slice(0, 20) + "..."); // Log partial token
          

            const response = await fetch('https://gatehub.runasp.net/api/Admin/Objections', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) throw new Error('Failed to fetch objections');
            
            const objections = await response.json();
            populateTable(objections);

        } catch (error) {
            console.error('Error:', error);
            alert('Failed to load objections: ' + error.message);
        }
    }

    // Populate table with data
    function populateTable(objections) {
        const tbody = document.getElementById('objectionsTable');
        tbody.innerHTML = '';

        objections.forEach(obj => {
            const row = `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap">${obj.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                            ${obj.statue === 'Rejected' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}">
                            ${obj.statue}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">${new Date(obj.date).toLocaleString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap max-w-xs truncate">${obj.description}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${obj.vehicleOwnerName}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${obj.plateNum}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <button class="text-blue-600 hover:text-blue-900 mr-4" onclick="viewDetails(${obj.id})">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="text-green-600 hover:text-green-900 mr-4" onclick="approveObjection(${obj.id})">
                            <i class="fas fa-check"></i>
                        </button>
                        <button class="text-red-600 hover:text-red-900" onclick="rejectObjection(${obj.id})">
                            <i class="fas fa-times"></i>
                        </button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', fetchObjections);

    // Update viewDetails function
    function viewDetails(id) {
        // Navigate to details page with objection ID
        window.location.href = `objection-details.html?id=${id}`;
    }

    function approveObjection(id) {
        console.log('Approve objection:', id);
    }

    function rejectObjection(id) {
        console.log('Reject objection:', id);
    }
</script>
<script>
    // Add these utility functions
    function showSuccess(message) {
        const successDiv = document.createElement('div');
        successDiv.className = 'bg-green-50 text-green-700 p-3 rounded-lg mb-4';
        successDiv.innerHTML = `
            <i class="fas fa-check-circle mr-2"></i>
            ${message}
        `;
        document.querySelector('.container').prepend(successDiv);
        setTimeout(() => successDiv.remove(), 5000);
    }

    function showError(message) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'bg-red-50 text-red-700 p-3 rounded-lg mb-4';
        errorDiv.innerHTML = `
            <i class="fas fa-exclamation-circle mr-2"></i>
            ${message}
        `;
        document.querySelector('.container').prepend(errorDiv);
        setTimeout(() => errorDiv.remove(), 5000);
    }

    // Modified approval functions
    async function handleObjectionAction(id, action) {
        try {
            const token = JSON.parse(localStorage.getItem('token'))?.result;
            

            const endpoint = action === 'approve' 
                ? `https://gatehub.runasp.net/api/Admin/AcceptObjection/${id}`
                : `https://gatehub.runasp.net/api/Admin/RejectObjection/${id}`;

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Action failed');
            }

            const result = await response.json();
            showSuccess(result.message);
            
            // Refresh the table after successful action
            await fetchObjections();

        } catch (error) {
            showError(`Action failed: ${error.message}`);
        }
    }

    // Update the action handlers
    async function approveObjection(id) {
        if (confirm('Are you sure you want to approve this objection?')) {
            const button = document.querySelector(`button[onclick="approveObjection(${id})"]`);
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            button.disabled = true;
            
            await handleObjectionAction(id, 'approve');
            
            button.innerHTML = '<i class="fas fa-check"></i>';
            button.disabled = false;
        }
    }

    async function rejectObjection(id) {
        if (confirm('Are you sure you want to reject this objection?')) {
            const button = document.querySelector(`button[onclick="rejectObjection(${id})"]`);
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            button.disabled = true;
            
            await handleObjectionAction(id, 'reject');
            
            button.innerHTML = '<i class="fas fa-times"></i>';
            button.disabled = false;
        }
    }

    // Update the populateTable function to disable actions for resolved objections
    function populateTable(objections) {
        const tbody = document.getElementById('objectionsTable');
        tbody.innerHTML = '';

        objections.forEach(obj => {
            const isPending = obj.statue === 'Pending';
            const row = `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap">${obj.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                            ${obj.statue === 'Rejected' ? 'bg-red-100 text-red-800' : 
                             obj.statue === 'Accepted' ? 'bg-green-100 text-green-800' : 
                             'bg-yellow-100 text-yellow-800'}">
                            ${obj.statue}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">${new Date(obj.date).toLocaleString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap max-w-xs truncate">${obj.description}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${obj.vehicleOwnerName}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${obj.plateNum}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <button class="text-blue-600 hover:text-blue-900 mr-4" onclick="viewDetails(${obj.id})">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="text-green-600 hover:text-green-900 mr-4 ${!isPending ? 'opacity-50 cursor-not-allowed' : ''}" 
                            onclick="${isPending ? `approveObjection(${obj.id})` : 'return false'}" 
                            ${!isPending ? 'disabled' : ''}>
                            <i class="fas fa-check"></i>
                        </button>
                        <button class="text-red-600 hover:text-red-900 ${!isPending ? 'opacity-50 cursor-not-allowed' : ''}" 
                            onclick="${isPending ? `rejectObjection(${obj.id})` : 'return false'}" 
                            ${!isPending ? 'disabled' : ''}>
                            <i class="fas fa-times"></i>
                        </button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }
</script>
