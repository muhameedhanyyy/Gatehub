<body>

  <main>
    <div class="container">

      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 d-flex flex-column align-items-center justify-content-center">

              <div class="d-flex justify-content-center py-4">
                <a href="index.html" class="logo d-flex align-items-center w-auto">
                  <img src="assets/img/logo.jpg" alt="">
                  <span class="d-none d-lg-block">GateHub</span>
                </a>
              </div><!-- End Logo -->

              <div class="card mb-3">

                <div class="card-body">

                  <div class="pt-4 pb-2">
                    <h5 class="card-title text-center pb-0 fs-4">Add New Gate Staff</h5>
                    <p class="text-center small">Enter the details to add a new gate staff member</p>
                  </div>

                  <form class="row g-3 needs-validation" id="gatestaffForm" novalidate>
                    <div class="col-12">
                      <label for="fullName" class="form-label">Full Name</label>
                      <input type="text" name="name" class="form-control" id="fullName" required>
                      <div class="invalid-feedback">Please enter the full name.</div>
                    </div>

                    <div class="col-12">
                      <label for="natid" class="form-label">National ID</label>
                      <input type="number" name="username" class="form-control" id="natid" required>
                      <div class="invalid-feedback">Please enter a username.</div>
                    </div>

                    <div class="col-12">
                      <label for="bdate" class="form-label">Birth date</label>
                      <input type="date" name="bdate" class="form-control" id="bdate" required>
                      <div class="invalid-feedback">Please enter a valid birth date .</div>
                    </div>

                    <div class="col-12">
                      <label for="gender" class="form-label">Gender</label>
                      <select class="form-control" id="gender" name="gender" required>
                          <option value="" selected disabled>Select Gender</option>
                          <option value="male">Male</option>
                          <option value="female">Female</option>
                      </select>
                      <div class="invalid-feedback">Please select a gender.</div>
                  </div>

                    <div class="col-12">
                      <label for="staffPhone" class="form-label">Phone Number</label>
                      <input type="number" name="phone" class="form-control" id="staffPhone" required>
                      <div class="invalid-feedback">Please enter the phone number.</div>
                    </div>

                    <div class="col-12">
                      <label for="gateId" class="form-label">Assigned Gate</label>
                      <input type="number" name="gate" class="form-control" id="gateId" required>
                      <div class="invalid-feedback">Please enter the assigned gate name or ID.</div>
                    </div>

                  

                    <div class="col-12">
                      <label for="password" class="form-label">Password</label>
                      <input type="password" name="password" class="form-control" id="password" required>
                      <div class="invalid-feedback">Please enter a password.</div>
                    </div>

                    <div class="col-12">
                      <button class="btn btn-primary w-100" type="submit">Add a Gate Staff</button>
                    </div>
                  </form>

                </div>
              </div>

              <div class="credits">
               </div>

            </div>
          </div>
        </div>

      </section>

    </div>
  </main><!-- End #main -->

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Template Main JS File -->
  <script src="assets/js/main.js"></script>



  <script>

        document.addEventListener('DOMContentLoaded', async () => {
   /// 1. Retrieve token with proper checks
            const tokenString = localStorage.getItem('token');

            if (!tokenString) {
                console.error("No token found - redirecting to login");
                window.location.href = 'login.html';
                return;
            }

            // 2. Parse with error handling
            let tokenObj;
            try {
                tokenObj = JSON.parse(tokenString);
            } catch (e) {
                console.error("Failed to parse token:", e);
                localStorage.removeItem('token');
                window.location.href = 'pages-login.html';
                return;
            }

            // 3. Extract the actual token with validation
        token = tokenObj?.result || tokenObj?.token || tokenObj;     
            
            if (!token || typeof token !== 'string' || !token.startsWith('eyJ')) {
                console.error("Invalid token format:", token);
                localStorage.removeItem('token');
                window.location.href = 'pages-login.html';
                return;
            }

            console.log("Token verified:", token.slice(0, 20) + "..."); // Log partial token
    });






















    document.getElementById('gatestaffForm').addEventListener('submit', async (event) => {
      event.preventDefault(); // Prevent default form submission
  
      // Collect form data
      const gateData = {
        fullName: document.getElementById('fullName').value,
        natId: document.getElementById('natid').value,
        birthDate: document.getElementById('bdate').value,
        gender: document.getElementById('gender').value,
        phoneNumber: document.getElementById('staffPhone').value,
        gateId: document.getElementById('gateId').value,
        password: document.getElementById('password').value,
      };
      console.log(gateData);
      try {
        const response = await fetch('http://gatehub.runasp.net/api/GateStaff/register-gatestaff', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(gateData),
        });
  
        if (!response.ok) {
          const errorDetails = await response.json();
          console.error('Error details:', errorDetails);
          throw new Error(`Failed to add gatestaff: ${response.status}`);
        }
  
        const result = await response.json();
        alert('gate staff  added successfully!');
        console.log(result);
        // Optionally clear the form
        document.getElementById('gatestaffForm').reset();
      } catch (error) {
        console.error('Error adding gatestaff:', error.message);
        // alert('Failed to add gate. Please try again.');
      }
    });
  </script>
</body>
