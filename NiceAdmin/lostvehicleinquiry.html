<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Lost Vehicle Inquiry</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="assets/img/logo.jpg" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/vendor/simple-datatables/style.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="assets/css/style.css" rel="stylesheet">

</head>

<body>

  <main>
    <div class="container">
      <section class="section lost-vehicle min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10 d-flex flex-column align-items-center justify-content-center">

              <!-- Logo -->
              <div class="d-flex justify-content-center py-4">
                <a href="index.html" class="logo d-flex align-items-center w-auto">
                  <img src="assets/img/logo.jpg" alt="Logo" class="me-2">
                  <span class="d-none d-lg-block fw-bold">GateHub</span>
                </a>
              </div><!-- End Logo -->

              <!-- Add Lost Vehicle Button -->
              <div class="d-flex justify-content-between w-100 mb-3">
                <h5 class="card-title">Lost Vehicle Records</h5>
                <a href="addlostvehicle.html" class="btn btn-primary">Add Lost Vehicle</a>
              </div>

              <!-- Search Card -->
              <div class="card mb-3 w-100">
                <div class="card-body">
                  <div class="pt-4 pb-2">
                    <h5 class="card-title text-center pb-0 fs-4">Lost Vehicle Inquiry</h5>
                    <p class="text-center small">Search for a lost vehicle by entering the license plate number</p>
                  </div>

                  <!-- Error Message -->
                  <div id="vehicleNotFoundError" class="alert alert-danger text-center" style="display: none;">
                    Vehicle not found in lost records. Please check the license plate.
                  </div>

                  <!-- Search Form -->
                  <form class="row g-3 needs-validation" novalidate id="lostVehicleForm">
                    <div class="col-12">
                      <label for="vehiclePlate" class="form-label">License Plate</label>
                      <input type="text" name="vehiclePlate" class="form-control" id="vehiclePlate" placeholder="Enter license plate" required>
                      <div class="invalid-feedback">Please enter the license plate.</div>
                    </div>

                    <div class="col-12">
                      <button class="btn btn-primary w-100" type="submit">Search</button>
                    </div>
                  </form>
                </div>
              </div><!-- End Search Card -->

              <!-- Lost Vehicle Results Table -->
              <div class="card mb-3 w-100">
                <div class="card-body">
                  <table class="table table-bordered" id="lostVehiclesTable">
                    <thead>
                      <tr>
                        <th scope="col">Vehicle ID</th>
                        <th scope="col">Plate Number</th>
                        <th scope="col">Reported Date</th>
                        <th scope="col">Status</th>
                        <th scope="col">Action</th>
                      </tr>
                    </thead>
                    <!-- Add this after the table header -->
<div id="loading" class="text-center my-3" style="display: none;">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>
                    <tbody>
                     
                    </tbody>
                  </table>
                </div>
              </div><!-- End Lost Vehicle Results Table -->

            </div>
          </div>
        </div>
      </section>
    </div>
</main>
  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    // Token handling and validation
    let authToken;
    try {
        const tokenString = localStorage.getItem('token');
        if (!tokenString) {
            throw new Error('No token found');
        }

        const tokenObj = JSON.parse(tokenString);
        authToken = tokenObj?.result || tokenObj?.token || tokenObj;
        
        if (!authToken || typeof authToken !== 'string' || !authToken.startsWith('eyJ')) {
            throw new Error('Invalid token format');
        }
        console.log("Token verified:", authToken.slice(0, 20) + "...");
    } catch (e) {
        console.error("Authentication error:", e);
        localStorage.removeItem('token');
        window.location.href = 'login.html';
        return;
    }

    // Lost Vehicles Functionality
    const form = document.getElementById('lostVehicleForm');
    const errorDiv = document.getElementById('vehicleNotFoundError');
    const tableBody = document.querySelector('#lostVehiclesTable tbody');
    let allLostVehicles = [];

    // Load initial data
    async function loadLostVehicles() {
        try {
            document.getElementById('loading').style.display = 'block';
            const response = await fetch('http://gatehub.runasp.net/api/Admin/getallLostVehicles', {
                headers: {
                    'Authorization': `Bearer ${authToken}`
                }
            });
            
            if (!response.ok) {
                if (response.status === 401) {
                    handleAuthError();
                    return;
                }
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            allLostVehicles = await response.json();
            populateTable(allLostVehicles);
        } catch (error) {
            console.error('Error:', error);
            alert('Failed to load lost vehicle data: ' + error.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    // Populate table with data
    function populateTable(vehicles) {
        tableBody.innerHTML = vehicles.map((vehicle, index) => `
            <tr data-vehicle-id="${vehicle.id}">
                <th scope="row">${index + 1}</th>
                <td>${vehicle.plateNumber}</td>
                <td>${new Date(vehicle.reportedDate).toLocaleDateString()}</td>
                <td>
                    <span class="badge ${vehicle.isFound ? 'bg-success' : 'bg-danger'}">
                        ${vehicle.isFound ? 'Recovered' : 'Active'}
                    </span>
                </td>
                <td>
                    ${!vehicle.isFound ? 
                    `<button class="btn btn-sm btn-success mark-found-btn px-4 py-2 text-white font-semibold bg-green-500 hover:bg-green-600 rounded-lg shadow-md transition-all duration-200 ease-in-out transform hover:scale-105">
                        Mark as Found
                    </button>` : ''}
                </td>
            </tr>
        `).join('');

        // Add event listeners to recovery buttons
        document.querySelectorAll('.mark-found-btn').forEach(button => {
            button.addEventListener('click', async (e) => {
                const row = e.target.closest('tr');
                const vehicleId = parseInt(row.dataset.vehicleId);
                const vehicle = allLostVehicles.find(v => v.id === vehicleId);

                if (!vehicle) return;

                if (confirm('Mark this vehicle as found?')) {
                    try {
                        const response = await fetch('http://gatehub.runasp.net/api/Admin/RecoverVehicle', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${authToken}`
                            },
                            body: JSON.stringify({
                                plateNum: vehicle.plateNumber
                            })
                        });

                        if (!response.ok) {
                            if (response.status === 401) {
                                handleAuthError();
                                return;
                            }
                            const errorData = await response.json();
                            throw new Error(errorData.message || `API request failed: ${response.status}`);
                        }

                        vehicle.isFound = true;
                        vehicle.reportedDate = new Date().toISOString();
                        populateTable(allLostVehicles);
                        alert('Vehicle recovered successfully!');
                    } catch (error) {
                        console.error('Recovery Error:', error);
                        alert(`Recovery failed: ${error.message}`);
                    }
                }
            });
        });
    }

    // Search functionality
    form.addEventListener('submit', function(event) {
        event.preventDefault();
        event.stopPropagation();
        
        if (form.checkValidity()) {
            const searchTerm = document.getElementById('vehiclePlate').value.trim().toLowerCase();
            const filtered = allLostVehicles.filter(vehicle => 
                vehicle.plateNumber.toLowerCase().includes(searchTerm));
            
            if (filtered.length > 0) {
                populateTable(filtered);
                errorDiv.style.display = 'none';
            } else {
                tableBody.innerHTML = '';
                errorDiv.style.display = 'block';
            }
        }
        form.classList.add('was-validated');
    });

    // Handle authentication errors
    function handleAuthError() {
        localStorage.removeItem('token');
        alert('Session expired. Please login again.');
        window.location.href = 'login.html';
    }

    // Initial load
    loadLostVehicles();
});
</script>



  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/simple-datatables/simple-datatables.js"></script>
  <script src="assets/js/main.js"></script>

</body>

</html>
