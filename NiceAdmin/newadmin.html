<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Add New Admin</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="assets/img/logo.jpg" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/vendor/quill/quill.snow.css" rel="stylesheet">
  <link href="assets/vendor/quill/quill.bubble.css" rel="stylesheet">
  <link href="assets/vendor/remixicon/remixicon.css" rel="stylesheet">
  <link href="assets/vendor/simple-datatables/style.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="assets/css/style.css" rel="stylesheet">

</head>

<body>

  <main>
    <div class="container">

      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 d-flex flex-column align-items-center justify-content-center">

              <div class="d-flex justify-content-center py-4">
                <a href="index.html" class="logo d-flex align-items-center w-auto">
                  <img src="assets/img/logo.jpg" alt="">
                  <span class="d-none d-lg-block">GateHub</span>
                </a>
              </div><!-- End Logo -->

              <div class="card mb-3">

                <div class="card-body">

                  <div class="pt-4 pb-2">
                    <h5 class="card-title text-center pb-0 fs-4">Add New Admin</h5>
                    <p class="text-center small">Enter the details to create a new admin account</p>
                  </div>

                  <form class="row g-3 needs-validation" novalidate>
                    <div class="col-12">
                      <label for="fullName" class="form-label">Full Name</label>
                      <input type="text" name="name" class="form-control" id="fullName" required>
                      <div class="invalid-feedback">Please enter the admin's full name.</div>
                    </div>

                    <div class="col-12">
                      <label for="natId" class="form-label">National ID</label>
                      <input type="text" name="username" class="form-control" id="natId" required>
                      <div class="invalid-feedback">Please enter a National ID.</div>
                    </div>

                    <div class="col-12">
                      <label for="phoneNumber" class="form-label">Phone Number</label>
                      <input type="text" name="phone" class="form-control" id="phoneNumber" required>
                      <div class="invalid-feedback">Please enter the phone number.</div>
                    </div>
                    <div class="col-md-12">
                      <label for="gender" class="form-label">gender</label>
                      <select name="gender" class="form-select" id="gender" required>
                        <option value="" disabled selected>Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                      </select>
                      <div class="invalid-feedback">Please select a gender.</div>
                    </div>
                    <div class="col-md-12">
                      <label for="birthDate" class="form-label">Birth Date</label>
                      <input type="date" name="birthDate" class="form-control" id="birthDate" required>
                      <div class="invalid-feedback">Please enter the birth date.</div>
                    </div>

                    

                   

                    <div class="col-12">
                      <label for="password" class="form-label">Password</label>
                      <input type="password" name="password" class="form-control" id="password" required>
                      <div class="invalid-feedback">Please enter a password.</div>
                    </div>

                    <div class="col-12">
                      <button class="btn btn-primary w-100" type="submit">Add a new Admin</button>
                    </div>
                  </form>

                </div>
              </div>

             
          </div>
        </div>

      </section>

    </div>
  </main><!-- End #main -->

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/apexcharts/apexcharts.min.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/chart.js/chart.umd.js"></script>
  <script src="assets/vendor/echarts/echarts.min.js"></script>
  <script src="assets/vendor/quill/quill.js"></script>
  <script src="assets/vendor/simple-datatables/simple-datatables.js"></script>
  <script src="assets/vendor/tinymce/tinymce.min.js"></script>
  <script src="assets/vendor/php-email-form/validate.js"></script>

  <!-- Template Main JS File -->
  <script src="assets/js/main.js"></script>
<script>
document.querySelector('.needs-validation').addEventListener('submit', async (event) => {
  event.preventDefault();
  event.stopPropagation();
/// 1. Retrieve token with proper checks
            const tokenString = localStorage.getItem('token');

            if (!tokenString) {
                console.error("No token found - redirecting to login");
                window.location.href = 'login.html';
                return;
            }

            // 2. Parse with error handling
            let tokenObj;
            try {
                tokenObj = JSON.parse(tokenString);
            } catch (e) {
                console.error("Failed to parse token:", e);
                localStorage.removeItem('token');
                window.location.href = 'pages-login.html';
                return;
            }

            // 3. Extract the actual token with validation
        token = tokenObj?.result || tokenObj?.token || tokenObj;     
            
            if (!token || typeof token !== 'string' || !token.startsWith('eyJ')) {
                console.error("Invalid token format:", token);
                localStorage.removeItem('token');
                window.location.href = 'pages-login.html';
                return;
            }

            console.log("Token verified:", token.slice(0, 20) + "..."); // Log partial token
  // Proceed with form submission if token is valid
  try {
    // Collect and format form data
    const formData = {
      fullName: document.getElementById('fullName').value,
      natId: document.getElementById('natId').value,
      phoneNumber: document.getElementById('phoneNumber').value,
      gender: document.getElementById('gender').value,
      birthDate: document.getElementById('birthDate').value ? 
        `${document.getElementById('birthDate').value}T00:00:00.000Z` : null,
      password: document.getElementById('password').value,
    };

    console.log('Payload being sent:', formData);

    const response = await fetch('http://gatehub.runasp.net/api/Admin/register-admin', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}` // Add authorization header
      },
      body: JSON.stringify(formData),
    });

    const responseData = await response.json();

    if (!response.ok) {
      console.error('API Error:', responseData);
      throw new Error(responseData.message || `Error ${response.status}: ${response.statusText}`);
    }

    alert('Admin added successfully!');
    console.log('Success:', responseData);
    event.target.reset();

  } catch (error) {
    console.error('Error adding admin:', error);
    alert(`Operation failed: ${error.message}`);
  }
});
</script>
  
  
</body>

</html>
