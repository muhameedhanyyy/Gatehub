            document.addEventListener('DOMContentLoaded', async () => {
    // 1. Retrieve token with proper checks
    const tokenString = localStorage.getItem('token');

    if (!tokenString) {
        console.error("No token found - redirecting to login");
        window.location.href = 'pages-login.html';
        return;
    }

    // 2. Handle both string and object token formats
    let token;
    try {
        // First try to parse as JSON (if it's an object)
        const tokenObj = JSON.parse(tokenString);
        // Check if it has a result property (API format) or use the whole object
        token = tokenObj?.result || tokenObj?.token || tokenObj;
        
        // If parsing succeeded but we got null/undefined, treat as invalid
        if (!token) throw new Error("Parsed token is empty");
    } catch (e) {
        // If JSON parse fails, assume it's a raw token string
        token = tokenString;
    }

    // 3. Final validation
    if (!token || typeof token !== 'string') {
        console.error("Invalid token format:", token);
        localStorage.removeItem('token');
        window.location.href = 'pages-login.html';
        return;
    }

    // Remove the JWT prefix check as it might vary
    console.log("Token verified:", token.slice(0, 20) + "...");
    });












        async function loadObjectionDetails() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const objectionId = urlParams.get('id');
                
                if (!objectionId) throw new Error('No objection specified');
    
                const token = JSON.parse(localStorage.getItem('token'))?.result;
    
                // First get all objections
                const response = await fetch('http://gatehub.runasp.net/api/Admin/Objections', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
    
                if (!response.ok) throw new Error('Failed to fetch objections');
                
                const objections = await response.json();
                
                // Find the specific objection
                const objection = objections.find(o => o.id == objectionId);
                if (!objection) throw new Error('Objection not found');
    
                // Populate data using CORRECT property names from your JSON
                document.getElementById('objection-id').textContent = objection.id;
                document.getElementById('status').textContent = objection.statue; // Note: "statue" not "status"
                document.getElementById('date').textContent = new Date(objection.date).toLocaleString();
                document.getElementById('description').textContent = objection.description;
                document.getElementById('vehicle-owner').textContent = objection.vehicleOwnerName;
                document.getElementById('plate-number').textContent = objection.plateNum; // Note: "plateNum" not "plateNumber"
    
            } catch (error) {
                console.error('Error:', error);
                document.body.innerHTML = `
                    <div class="container mx-auto p-6">
                        <div class="bg-red-50 text-red-700 p-4 rounded-lg">
                            <p class="font-bold">Error:</p>
                            <p>${error.message}</p>
                            <a href="admin-objections.html" class="text-blue-600 mt-2 inline-block">
                                Return to objections list
                            </a>
                        </div>
                    </div>
                `;
            }
        }
    
        document.addEventListener('DOMContentLoaded', loadObjectionDetails);
    </script>
    <script>
        // Main objection loading function
        async function loadObjectionDetails() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const objectionId = urlParams.get('id');
                
                if (!objectionId) throw new Error('No objection specified');
                
                const token = JSON.parse(localStorage.getItem('token'))?.result;
    
                // Fetch all objections
                const response = await fetch('http://gatehub.runasp.net/api/Admin/Objections', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
    
                if (!response.ok) throw new Error('Failed to fetch objections');
                
                const objections = await response.json();
                const objection = objections.find(o => o.id == objectionId);
                
                if (!objection) throw new Error('Objection not found');
    
                // Populate data with correct property names
                document.getElementById('objection-id').textContent = objection.id;
                document.getElementById('status').textContent = objection.statue;
                document.getElementById('date').textContent = new Date(objection.date).toLocaleString();
                document.getElementById('description').textContent = objection.description;
                document.getElementById('vehicle-owner').textContent = objection.vehicleOwnerName;
                document.getElementById('plate-number').textContent = objection.plateNum;
    
                // Set initial button states
                const isPending = objection.statue === 'Pending';
                document.getElementById('accept-button').disabled = !isPending;
                document.getElementById('reject-button').disabled = !isPending;
    
            } catch (error) {
                console.error('Error:', error);
                document.body.innerHTML = `
                    <div class="container mx-auto p-6">
                        <div class="bg-red-50 text-red-700 p-4 rounded-lg">
                            <p class="font-bold">Error:</p>
                            <p>${error.message}</p>
                            <a href="admin-objections.html" class="text-blue-600 mt-2 inline-block">
                                Return to objections list
                            </a>
                        </div>
                    </div>
                `;
            }
        }
    
        // Action handling function
        async function handleObjectionAction(action) {
            try {
                const token = JSON.parse(localStorage.getItem('token'))?.result;
                const objectionId = new URLSearchParams(window.location.search).get('id');
                const acceptBtn = document.getElementById('accept-button');
                const rejectBtn = document.getElementById('reject-button');
    
                // Disable buttons during processing
                acceptBtn.disabled = true;
                rejectBtn.disabled = true;
                
                // Set loading state
                if (action === 'accept') {
                    acceptBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
                } else {
                    rejectBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
                }
    
                // API endpoint selection
                const endpoint = action === 'accept' 
                    ? `http://gatehub.runasp.net/api/Admin/AcceptObjection/${objectionId}`
                    : `http://gatehub.runasp.net/api/Admin/RejectObjection/${objectionId}`;
    
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
    
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Action failed');
                }
    
                // Update UI state
                const newStatus = action === 'accept' ? 'Accepted' : 'Rejected';
                document.getElementById('status').textContent = newStatus;
                
                // Show success message
                const result = await response.json();
                showSuccess(result.message);
    
            } catch (error) {
                showError(`Action failed: ${error.message}`);
            } finally {
                // Reset button states
                document.getElementById('accept-button').innerHTML = 'Accept Objection';
                document.getElementById('reject-button').innerHTML = 'Reject Objection';
                
                // Keep buttons disabled after action
                document.getElementById('accept-button').disabled = true;
                document.getElementById('reject-button').disabled = true;
            }
        }
    
        // Helper functions
        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'bg-green-50 text-green-700 p-3 rounded-lg mb-4';
            successDiv.innerHTML = `
                <i class="fas fa-check-circle mr-2"></i>
                ${message}
            `;
            document.querySelector('.container').prepend(successDiv);
            setTimeout(() => successDiv.remove(), 5000);
        }
    
        function showError(message) {
            const errorContainer = document.getElementById('error-message');
            if (errorContainer) {
                errorContainer.innerHTML = `
                    <div class="bg-red-50 text-red-700 p-4 rounded-lg">
                        <p class="font-bold">Error:</p>
                        <p>${message}</p>
                    </div>
                `;
                errorContainer.classList.remove('hidden');
            }
        }
    
        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            loadObjectionDetails();
            
            document.getElementById('accept-button').addEventListener('click', () => {
                if (confirm('Are you sure you want to accept this objection?')) {
                    handleObjectionAction('accept');
                }
            });
    
            document.getElementById('reject-button').addEventListener('click', () => {
                if (confirm('Are you sure you want to reject this objection?')) {
                    handleObjectionAction('reject');
                }
            });
        });
    </script>
</body>
