<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Vehicle Inquiry</title>
  <link href="assets/img/logo.jpg" rel="icon">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
  <main>
    <div class="container">
      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
              <div class="card mb-3">
                <div class="card-body">
                  <div class="pt-4 pb-2">
                    <h5 class="card-title text-center fs-4">Vehicle Inquiry</h5>
                    <p class="text-center small">Enter vehicle details to retrieve its information</p>
                  </div>

                  <div id="vehicleNotFoundError" class="alert alert-danger text-center" style="display: none;">
                    Vehicle not found. Please check the entered details and try again.
                  </div>

                  <form class="needs-validation" novalidate id="inquiryForm">
                    <div class="mb-3">
                      <label for="licensePlate" class="form-label">License Plate</label>
                      <input type="text" id="licensePlate" class="form-control" required>
                      <div class="invalid-feedback">Please enter the vehicle's license plate.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Search</button>
                  </form>
                </div>
              </div>

              <div class="card mb-3" id="resultsCard" style="display: none;">
                <div class="card-body">
                  <table class="table" id="vehicleTable">
                    <thead>
                      <tr>
                        <th>#</th>
                        <th>License Plate</th>
                        <th>Owner Name</th>
                        <th>Type</th>
                        <th>Last Gate</th>
                        <th>Last Passing Date</th>
                        <th>Total Fees</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    document.getElementById('inquiryForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const form = event.target;
      const errorDiv = document.getElementById('vehicleNotFoundError');
      const resultsCard = document.getElementById('resultsCard');

      if (form.checkValidity()) {
        try {
          const licensePlate = encodeURIComponent("123ن ف ر")
          console.log(licensePlate)
          const encodedPlate = "123ن ف ر";
          console.log(encodedPlate)
          // const apiUrl = `http://gatehub.runasp.net/api/Admin/GetVehicleByPlateNumberWithOwner?plateNum=${licensePlate}`;
          // const response = await fetch(apiUrl);
          const response = await fetch('http://gatehub.runasp.net/api/Admin/GetVehicleByPlateNumberWithOwner?plateNum=${encodedPlate}', {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
          
        });
          

          if (!response.ok) throw new Error(`HTTP error: ${response.status}`);

          const vehicleData = await response.json();
          if (!vehicleData.length) throw new Error('No vehicles found.');

          errorDiv.style.display = 'none';
          resultsCard.style.display = 'block';

          const tbody = document.querySelector('#vehicleTable tbody');
          tbody.innerHTML = '';

          vehicleData.forEach((vehicle, index) => {
            const row = `
              <tr>
                <th scope="row">${index + 1}</th>
                <td>${vehicle.plateNumber || 'N/A'}</td>
                <td>${vehicle.ownerName || 'N/A'}</td>
                <td>${vehicle.type || 'N/A'}</td>
                <td>${vehicle.lastGate || 'N/A'}</td>
                <td>${vehicle.lastPassingDate ? new Date(vehicle.lastPassingDate).toLocaleString() : 'N/A'}</td>
                <td>EGP ${vehicle.totalFees || 0}</td>
                <td>
                  <span class="badge ${vehicle.status === 'Active' ? 'bg-success' : 'bg-danger'}">
                    ${vehicle.status || 'Unknown'}
                  </span>
                </td>
              </tr>`;
            tbody.insertAdjacentHTML('beforeend', row);
          });
        } catch (error) {
          console.error(error);
          errorDiv.style.display = 'block';
          resultsCard.style.display = 'none';
        }
      }

      form.classList.add('was-validated');
    });
  </script>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
