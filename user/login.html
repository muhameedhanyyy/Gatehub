<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <!-- Custom CSS for the button -->
    <style>
        .btn-about-us {
    background: linear-gradient(135deg, #7C9AFC, #5B7FFB); /* Lighter gradient */
    border: none;
    color: white;
    padding: 10px 20px; /* Slightly larger padding */
    border-radius: 25px;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Subtle shadow */
}
.btn-about-us:hover {
    background: linear-gradient(135deg, #5B7FFB, #7C9AFC); /* Reverse gradient on hover */
    transform: translateY(-2px); /* Lift effect on hover */
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); /* Stronger shadow on hover */
}
.btn-about-us:active {
    transform: translateY(0); /* Reset lift effect on click */
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Reset shadow on click */
}
.error-message {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
            display: none;
        }
        .is-invalid {
            border-color: #dc3545 !important;
        }
        .loading {
            position: relative;
            pointer-events: none;
        }
        .loading:after {
            content: " ";
            display: inline-block;
            width: 1em;
            height: 1em;
            margin-left: 0.5em;
            vertical-align: middle;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: rotate 0.75s linear infinite;
        }
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
        
    .error-message {
        color: #dc3545;
        font-size: 0.875em;
        display: none;
        margin-top: 4px;
    }
    
    .success-message {
        color: #28a745;
        font-size: 0.875em;
        display: none;
        margin-top: 4px;
    }
    #forgotPasswordLink:hover {
        background-color: #e9ecef !important;
        border-color: #ced4da !important;
        color: #5c636a !important;
        text-decoration: underline;
    }
    
    #forgotPasswordLink:active {
        transform: scale(0.98);
    }
    #countdown {
        display: none;
    background: #f8f9fa;
    border-radius: 8px;
    padding: 1.5rem;
    margin: 2rem auto;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 2px 15px rgba(0,0,0,0.1);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

#countdown button {
    background-color: #e9ecef;
    color: #495057;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    margin-left: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.9em;
}

#countdown button:hover {
    background-color: #dee2e6;
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* Add a progress bar animation */
.countdown-progress {
    height: 4px;
    background: #e9ecef;
    border-radius: 2px;
    margin-top: 1rem;
    overflow: hidden;
    position: relative;
}

.countdown-progress::after {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    background: #4dabf7;
    animation: progress 5s linear forwards;
}



/* Add some text styling */
#countdown {
    font-size: 1.1rem;
    color: #343a40;
}

#countdown strong {
    color: #4dabf7;
    font-weight: 600;
}

/* For cancelled state */
.redirect-cancelled {
    color: #dc3545;
    background: #fff5f5;
    border: 1px solid #ffd6d6;
}
    </style>
</head>
<body>
    <!-- Header -->
    <header class="d-flex justify-content-between align-items-center p-2">
        <div class="d-flex align-items-center">
            <img alt="GateHub logo" class="rounded-circle" src="assets/logo.jpg" width="40" height="40"/>
            <span class="ms-2 fs-5 fw-bold">GateHub</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <button class="btn-about-us" onclick="window.location.href='index.html';">
                <i class="fas fa-info-circle"></i>
                About Us
            </button>
        </div>
    </header>
    <hr class="my-1">

    <!-- Main Content -->
    <main class="bg-light d-flex justify-content-center align-items-center min-vh-100">
        <div class="bg-white p-3 rounded shadow-sm" style="max-width: 400px; width: 100%;">
            <div class="mb-3">
                <img alt="Skyline of a city with tall buildings" class="img-fluid rounded" src="https://storage.googleapis.com/a1aa/image/8my_hvLHoOHQnAV40e39pZqR337Jzi5wp32zOLXem8I.jpg"/>
            </div>
            <h1 class="text-center fs-4 fw-bold mb-3">Welcome to GateHub</h1>
            <form id="loginForm">
                <!-- Existing login form fields -->
                <div class="mb-2">
                    <label for="national-id" class="form-label">National ID</label>
                    <input type="text" class="form-control form-control-sm" id="national-id" 
                           placeholder="Enter National ID" 
                           maxlength="14"
                           required>
                    <div class="error-message" id="nationalIdError">
                        National ID must be exactly 14 digits
                    </div>
                </div>
                <div class="mb-2">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control form-control-sm" id="password" 
                           placeholder="Enter Password" 
                           required>
                    <div class="error-message" id="passwordError">
                        Password is required
                    </div>
                    <div class="error-message" id="invalidCredentialsError">
                        Invalid National ID or Password
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-sm w-100" id="submitBtn">
                    Log in
                </button>
            </form>
    
            <!-- Forgot Password Section -->
            <div class="position-relative mt-3" style="min-height: 30px;">
                <a href="#" id="forgotPasswordLink" 
                   class="text-decoration-none text-muted d-inline-block position-absolute start-0 bottom-0 bg-light p-1 px-2 rounded border"
                   style="transition: all 0.2s ease; font-size: 0.9em;">
                    <i class="fas fa-question-circle me-1"></i>Forgot Password?
                </a>
            </div>
            
            <div id="forgotPasswordForm" style="display: none;" >
                <div class="mb-2 mt-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control form-control-sm" id="email" 
                           placeholder="Enter your email" 
                           required>
                    <div class="error-message" id="emailError">
                        Please enter a valid email address
                    </div>
                </div>
                <button type="button" class="btn btn-outline-primary btn-sm w-100" id="requestOtpBtn">
                    Request OTP
                </button>
                <div class="success-message mt-2" id="otpSuccess" style="display: none;">
                    OTP has been sent to your email.
                </div>
                <div class="error-message" id="otpError" style="display: none;">
                    Error sending OTP. Please try again.
                </div>
            </div>
            
            <p id="countdown">
                Redirecting in <strong>5</strong> seconds... 
                <button onclick="cancelRedirect()">Cancel</button>
            </p>       
         </div>
    </main>
    <!-- Bootstrap JS (Optional, for interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Firebase App (required) -->
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js"></script>
<!-- Firebase Messaging (required for FCM) -->
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-messaging.js"></script>




<script>
       // Firebase Initialization (Make sure to include Firebase SDK scripts in your HTML)
    async function initializeFirebase() {
        try {
            const firebaseConfig = {
                 apiKey: "AIzaSyBiK4lrBKwwoFYuSPWhbN2Gcp74yRZI4pg",
            authDomain: "gatehub-c9158.firebaseapp.com",
            projectId: "gatehub-c9158",
            storageBucket: "gatehub-c9158.firebasestorage.app",
            messagingSenderId: "645215949745",
            appId: "1:645215949745:web:b8f43603eb3819ca03e390",
            measurementId: "G-ZBVRGMNL5D"
            };
            firebase.initializeApp(firebaseConfig);
            const messaging = firebase.messaging();

            // Request Permission and Get Device Token
            await messaging.requestPermission();
            const deviceToken = await messaging.getToken();
            console.log('Device Token:', deviceToken);

            // Save Device Token Locally
            localStorage.setItem('deviceToken', deviceToken);
        } catch (error) {
            console.error('Firebase initialization error:', error);
        }
    }

    // Authentication Function
    async function authenticate(nationalId, password) {
        try {
            const deviceToken = localStorage.getItem('deviceToken') || null;
            const response = await fetch('https://gatehub.runasp.net/api/VehicleOwner/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ natId: nationalId, password: password, deviceToken: deviceToken })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || 'Invalid credentials');
            }

            const result = await response.json();
            localStorage.setItem('token', JSON.stringify(result.tokenString));
            setTimeout(() => { window.location.href = 'personal_information.html'; }, 1500);

            return true;
        } catch (err) {
            console.error('Authentication failed:', err.message);
            return false;
        }
    }

    // Call Firebase Initialization
    initializeFirebase();

    // Login Form Handling (Unchanged from previous script)
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        const nationalIdInput = document.getElementById('national-id');
        const passwordInput = document.getElementById('password');
        const nationalIdError = document.getElementById('nationalIdError');
        const passwordError = document.getElementById('passwordError');
        const invalidCredentialsError = document.getElementById('invalidCredentialsError');

        nationalIdError.style.display = 'none';
        passwordError.style.display = 'none';
        invalidCredentialsError.style.display = 'none';
        nationalIdInput.classList.remove('is-invalid');
        passwordInput.classList.remove('is-invalid');

        const nationalId = nationalIdInput.value.trim();
        const password = passwordInput.value.trim();
        let isValid = true;

        if (!/^\d{14}$/.test(nationalId)) {
            nationalIdInput.classList.add('is-invalid');
            nationalIdError.style.display = 'block';
            isValid = false;
        }

        if (password === '') {
            passwordInput.classList.add('is-invalid');
            passwordError.style.display = 'block';
            isValid = false;
        }

        if (!isValid) {
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
            return;
        }

        try {
            const isAuthenticated = await authenticate(nationalId, password);
            if (!isAuthenticated) {
                invalidCredentialsError.style.display = 'block';
                passwordInput.classList.add('is-invalid');
            }
        } catch (error) {
            console.error('Login error:', error);
        } finally {
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
        }
    });

    // National ID Input Validation
    document.getElementById('national-id').addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
    });

    // Clear Errors on Input
    document.getElementById('password').addEventListener('input', function() {
        this.classList.remove('is-invalid');
        document.getElementById('invalidCredentialsError').style.display = 'none';
    });

    // Countdown and Redirect
    let redirectTimer;
    let countdownTimer;
    let seconds = 5;

    function startRedirect() {
        const countdownElement = document.getElementById('countdown');
        redirectTimer = setTimeout(() => {
            window.location.href = 'profile.html';
        }, 5000);

        countdownTimer = setInterval(() => {
            seconds--;
            countdownElement.innerHTML = `Redirecting in ${seconds} seconds... <button onclick="cancelRedirect()">Cancel</button>`;
            if (seconds <= 0) clearInterval(countdownTimer);
        }, 1000);
    }

    function cancelRedirect() {
        clearTimeout(redirectTimer);
        clearInterval(countdownTimer);
        const countdownElement = document.getElementById('countdown');
        countdownElement.innerHTML = "Redirect cancelled";
        countdownElement.classList.add('redirect-cancelled');
        setTimeout(() => { countdownElement.style.display = 'none'; }, 2000);
    }

    // Forgot Password Link Handling
    document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById('forgotPasswordForm').style.display = 'block';
    });

    // OTP Request Handling
    document.getElementById('requestOtpBtn').addEventListener('click', function() {
        const email = document.getElementById('email').value;
        const emailError = document.getElementById('emailError');
        const otpSuccess = document.getElementById('otpSuccess');
        const otpError = document.getElementById('otpError');

        emailError.style.display = 'none';
        otpSuccess.style.display = 'none';
        otpError.style.display = 'none';

        if (!validateEmail(email)) {
            emailError.style.display = 'block';
            return;
        }

        fetch('https://gatehub.runasp.net/api/VehicleOwner/request-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        }).then(response => {
            if (response.ok) {
                otpSuccess.style.display = 'block';
                document.getElementById('countdown').style.display = 'block';
                startRedirect();
            } else {
                response.json().then(error => {
                    otpError.textContent = error.message || 'Error sending OTP. Please try again.';
                    otpError.style.display = 'block';
                });
            }
        }).catch(error => {
            otpError.textContent = 'Failed to connect to the server. Please check your internet connection.';
            otpError.style.display = 'block';
        });
    });

    // Email Validation
    function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }
</script>



</body>
</html>
