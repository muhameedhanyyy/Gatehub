<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicle - GateHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Use existing style variables from previous pages */
        :root {
            --primary: #3b82f6;
            --secondary: #60a5fa;
            --accent: #9ca3af;
            --background-light: #f3f4f6;
            --text-primary: #374151;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
        }

        .vehicle-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .history-table th,
        .history-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-paid {
            background-color: #dcfce7;
            color: #16a34a;
        }

        .status-pending {
            background-color: #fef9c3;
            color: #ca8a04;
        }

        .status-overdue {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .vehicle-card {
            @apply bg-white rounded-lg shadow-sm p-6 mb-8;
        }
        .history-table {
            @apply min-w-full divide-y divide-gray-200;
        }
        .status-badge {
            @apply px-2 py-1 rounded-full text-xs font-medium;
        }
        .status-paid {
            @apply bg-green-100 text-green-800;
        }
        .status-pending {
            @apply bg-yellow-100 text-yellow-800;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Header (Same as other pages) -->
    <header class="bg-white shadow-sm p-4">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center">
              <a href="index.html">  <img src="assets/logo.jpg" alt="Logo" class="h-10 w-10 rounded-full"></a>
                <span class="ml-2 text-xl font-bold text-gray-800">GateHub</span>
            </div>
            <div class="flex items-center space-x-8">
                <nav class="flex space-x-6">
                    <a href="personal_information.html" class="text-gray-700 hover:text-blue-600">My Profile</a>
                    <a href="myvehicle.html" class="text-gray-700 hover:text-blue-600">My Vehicle</a>
                    <a href="recharge.html" class="text-gray-700 hover:text-blue-600">My Wallet</a>
                    <a href="pay.html" class="text-gray-700 hover:text-blue-600">Payments</a>
                    <a href="index.html" class="text-gray-700 hover:text-blue-600">Help</a>
                </nav>
                
                <div class="flex items-center space-x-4">
                    <a href="settings.html"> <i class="fas fa-cog text-xl text-gray-600 cursor-pointer hover:text-blue-600"></i></a> <!-- Settings icon -->
                 </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8" id="mainContent">
        <!-- Vehicle Details Card -->
           <div id="loading" class="text-center py-8 hidden">
            <i class="fas fa-spinner fa-spin text-blue-600 text-3xl"></i>
            <p class="mt-2 text-gray-600">Loading vehicle data...</p>
        </div>
        
    
                <div id="vehiclesContainer" class="space-y-6"></div>
    </main>



    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const loadingElement = document.getElementById('loading');
        const container = document.getElementById('vehiclesContainer');
        
        // Show loading indicator
        loadingElement.classList.remove('hidden');
        container.innerHTML = '';

        try {
            // Token handling (same as before)
            const tokenString = localStorage.getItem('token');
            if (!tokenString) {
                window.location.href = 'login.html';
                return;
            }

            const token = JSON.parse(tokenString)?.result || JSON.parse(tokenString);
            if (!token || typeof token !== 'string') {
                throw new Error('Invalid token format');
            }

            // Fetch from new API endpoint
            const response = await fetch('http://gatehub.runasp.net/api/VehicleOwner/GetAllVehicles', {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const vehicles = await response.json();

            // Generate vehicle cards
            vehicles.forEach(vehicle => {
                const vehicleCard = document.createElement('div');
                vehicleCard.className = 'vehicle-card';
                vehicleCard.innerHTML = `
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">
                            <i class="fas fa-car mr-3 text-blue-600"></i>
                            ${vehicle.plateNumber}
                        </h2>
                        <span class="status-badge ${vehicle.type === 'أجرة' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800'}">
                            ${vehicle.type}
                        </span>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div>
                            <p class="text-sm text-gray-600">License Start</p>
                            <p class="font-medium">${new Date(vehicle.licenseStart).toLocaleDateString()}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-600">License End</p>
                            <p class="font-medium">${new Date(vehicle.licenseEnd).toLocaleDateString()}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-600">Model</p>
                            <p class="font-medium">${vehicle.modelCompany} - ${vehicle.modelDescription}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-600">Color</p>
                            <p class="font-medium">${vehicle.color}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-600">RFID</p>
                            <p class="font-medium">${vehicle.rfid}</p>
                        </div>
                    </div>

                    ${vehicle.vehicleEntries.length > 0 ? `
                    <div class="mt-8">
                        <h3 class="text-xl font-bold text-gray-800 mb-4">
                            <i class="fas fa-history mr-3 text-blue-600"></i>
                            Payment History
                        </h3>

                        <div class="overflow-x-auto">
                            <table class="history-table">
                                <thead>
                                    <tr class="bg-gray-50">
                                        <th class="px-4 py-3 text-left">Date</th>
                                        <th class="px-4 py-3 text-left">Type</th>
                                        <th class="px-4 py-3 text-left">Fee</th>
                                        <th class="px-4 py-3 text-left">Fine</th>
                                        <th class="px-4 py-3 text-left">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${vehicle.vehicleEntries.map(entry => `
                                        <tr class="hover:bg-gray-50">
                                            <td class="px-4 py-3">${new Date(entry.date).toLocaleDateString()}</td>
                                            <td class="px-4 py-3">${entry.fineType || 'Toll Fee'}</td>
                                            <td class="px-4 py-3">$${entry.feeValue.toFixed(2)}</td>
                                            <td class="px-4 py-3">$${entry.fineValue.toFixed(2)}</td>
                                            <td class="px-4 py-3">
                                                <span class="status-badge ${entry.isPaid ? 'status-paid' : 'status-pending'}">
                                                    ${entry.isPaid ? 'Paid' : 'Pending'}
                                                </span>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <!-- Summary Section -->
                        <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                            ${generateSummary(vehicle.vehicleEntries)}
                        </div>
                    </div>` : '<p class="mt-6 text-gray-500">No payment history available</p>'}
                `;

                container.appendChild(vehicleCard);
            });

        } catch (error) {
            console.error('Error:', error);
            alert('Failed to load vehicle data. Please try again later.');
        } finally {
            loadingElement.classList.add('hidden');
        }
    });

    function generateSummary(entries) {
        let totalFees = 0;
        let paidAmount = 0;
        let pendingPayments = 0;

        entries.forEach(entry => {
            const total = entry.feeValue + entry.fineValue;
            totalFees += total;
            entry.isPaid ? (paidAmount += total) : (pendingPayments += total);
        });

        return `
            <div class="bg-blue-50 p-4 rounded-lg">
                <p class="text-sm text-gray-600">Total Fees</p>
                <p class="text-xl font-bold">$${totalFees.toFixed(2)}</p>
            </div>
            <div class="bg-green-50 p-4 rounded-lg">
                <p class="text-sm text-gray-600">Paid Amount</p>
                <p class="text-xl font-bold">$${paidAmount.toFixed(2)}</p>
            </div>
            <div class="bg-yellow-50 p-4 rounded-lg">
                <p class="text-sm text-gray-600">Pending Payments</p>
                <p class="text-xl font-bold">$${pendingPayments.toFixed(2)}</p>
            </div>
        `;
    }
    </script>
</body>
</html>
