<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .profile-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
    
        .vehicle-card {
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid #5B7FFB;
        }
    
        .vehicle-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(91, 127, 251, 0.1);
        }
    
        .transaction-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        .transaction-card:hover {
            transform: translateY(-3px);
        }
    
        .transaction-type {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    
        .recharge { background: #e3f2fd; color: #2196f3; }
        .payment { background: #e8f5e9; color: #4caf50; }
        .fine { background: #ffebee; color: #f44336; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Loading Spinner -->
    <div id="loading" class="fixed inset-0 bg-white bg-opacity-90 flex items-center justify-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
    </div>

    <!-- Navbar -->
    <header class="bg-white shadow-sm p-4">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center">
                <a href="index.html">
                    <img src="assets/logo.jpg" alt="Logo" class="h-10 w-10 rounded-full">
                </a>
                <span class="ml-2 text-xl font-bold text-gray-800">GateHub</span>
            </div>
            <div class="flex items-center space-x-8">
                <nav class="flex space-x-6">
                    <a href="personal_information.html" class="text-gray-700 hover:text-blue-600">My Profile</a>
                    <a href="myvehicle.html" class="text-gray-700 hover:text-blue-600">My Vehicle</a>
                    <a href="recharge.html" class="text-gray-700 hover:text-blue-600">My Wallet</a>
                    <a href="pay.html" class="text-gray-700 hover:text-blue-600">Payments</a>
                    <a href="index.html" class="text-gray-700 hover:text-blue-600">Help</a>
                </nav>
                <div class="flex items-center space-x-4">
                    <a href="settings.html">
                        <i class="fas fa-cog text-xl text-gray-600 cursor-pointer hover:text-blue-600"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Personal Information Section -->
        <div class="profile-card p-6 mb-8">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800" id="userName">Loading...</h1>
                    <div class="flex items-center mt-2 space-x-4">
                        <span class="text-gray-600" id="phoneNumber">
                            <i class="fa-solid fa-phone"></i> Phone: Loading...
                        </span>
                        <span class="text-gray-600" id="address">
                            <i class="fa-solid fa-location-dot"></i> Address: Loading...
                        </span>
                        <span class="text-gray-600" id="license">
                            <i class="fa-solid fa-id-card"></i> License: Loading...
                        </span>
                        <span class="text-gray-600" id="balance">
                            <i class="fa-solid fa-money-check-dollar"></i> Balance: Loading...
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vehicles Section -->
        <div class="mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">
                <i class="fas fa-car-side mr-2 text-blue-500"></i>Registered Vehicles
            </h2>
            <div class="grid gap-4" id="vehiclesContainer">
                <!-- Vehicles will be dynamically inserted here -->
            </div>
        </div>

        <!-- Transaction History Section -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Transaction History</h2>
            <div class="space-y-4" id="transactionsContainer">
                <!-- Transactions will be dynamically inserted here -->
            </div>
            
            <!-- Total Balance -->
            <div class="mt-8 pt-6 border-t border-gray-200">
                <div class="flex justify-between items-center">
                    <h3 class="font-semibold text-gray-700">Total Balance</h3>
                    <p class="text-xl font-bold text-gray-800" id="totalBalance">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Add this at the very beginning of your script
if (!localStorage.getItem('token')) {
    window.location.href = 'login.html';
}

console.log('Token:', localStorage.getItem('token')); // Should show your JWT token
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const token = localStorage.getItem('token');
            const response = await fetch('http://gatehub.runasp.net/api/VehicleOwner/VOProfile', {
                headers: {
                     "Content-Type": "application/json",
                "Authorization": Bearer `${token}`
                
                    // Add authorization header if required:
                    // 'Authorization': 'Bearer ' + localStorage.getItem('token')
                   
                }
            });
            
            if (!response.ok) throw new Error('Failed to fetch profile');
            
            const data = await response.json();

            // Update Personal Information
            document.getElementById('userName').textContent = data.appUser?.userName || 'Mohamed Hany';
            document.getElementById('phoneNumber').innerHTML = 
                `<i class="fa-solid fa-phone"></i> Phone: ${data.phoneNumber}`;
            document.getElementById('address').innerHTML = 
                `<i class="fa-solid fa-location-dot"></i> Address: ${data.address}`;
            document.getElementById('license').innerHTML = 
                `<i class="fa-solid fa-id-card"></i> License: ${data.license}`;
            document.getElementById('balance').innerHTML = 
                `<i class="fa-solid fa-money-check-dollar"></i> Balance: ${data.balance.toFixed(2)} EGP`;

            // Update Vehicles
            const vehiclesContainer = document.getElementById('vehiclesContainer');
            vehiclesContainer.innerHTML = data.vehicles.map(vehicle => `
                <div class="vehicle-card bg-white p-5 rounded-lg">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="font-semibold text-gray-800">${vehicle.plateNumber}</h3>
                            <div class="text-sm text-gray-600 mt-1">
                                <span class="mr-4">License Start: ${new Date(vehicle.licenseStart).toLocaleDateString()}</span>
                                <span class="mr-4">License End: ${new Date(vehicle.licenseEnd).toLocaleDateString()}</span>
                                <span class="mr-4">Model: ${vehicle.modelCompany} - ${vehicle.modelDescription}</span>
                                <span class="mr-4">Color: ${vehicle.color}</span>
                                <span class="mr-4">Type: ${vehicle.type}</span>
                                <span class="text-green-600">Active</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Update Transactions
            const transactionsContainer = document.getElementById('transactionsContainer');
            transactionsContainer.innerHTML = data.transactions.map(transaction => `
                <div class="transaction-card">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="transaction-type ${getTransactionTypeClass(transaction.paymentType)}">
                                ${getTransactionIcon(transaction.paymentType)}
                            </div>
                            <div>
                                <h3 class="font-semibold">${transaction.paymentType}</h3>
                                <p class="text-sm text-gray-500">${new Date(transaction.transactionDate).toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-semibold ${transaction.amount > 0 ? 'text-green-600' : 'text-red-600'}">
                                ${transaction.amount > 0 ? '+' : '-'} ${Math.abs(transaction.amount).toFixed(2)} EGP
                            </p>
                            <p class="text-sm text-gray-500">${transaction.status}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            // Update Total Balance
            document.getElementById('totalBalance').textContent = 
                `${data.balance.toFixed(2)} EGP`;

        } catch (error) {
            console.error('Error:', error);
            alert('Failed to load profile data. Please try again later.');
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    });

    function getTransactionTypeClass(paymentType) {
        const typeMap = {
            'Balance Recharge': 'recharge',
            'Vehicle Entry Payment': 'payment',
            'Fee and Fine': 'fine',
            'Balance Payment': 'payment'
        };
        return typeMap[paymentType] || 'payment';
    }

    function getTransactionIcon(paymentType) {
        const iconMap = {
            'Balance Recharge': '<i class="fas fa-wallet"></i>',
            'Vehicle Entry Payment': '<i class="fas fa-toll"></i>',
            'Fee and Fine': '<i class="fas fa-exclamation-triangle"></i>',
            'Balance Payment': '<i class="fas fa-money-bill-transfer"></i>'
        };
        return iconMap[paymentType] || '<i class="fas fa-receipt"></i>';
    }
    </script>
</body>
</html>
