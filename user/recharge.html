<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recharge Account - GateHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .payment-card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .payment-card:hover {
            transform: translateY(-3px);
            border-color: #3b82f6;
        }
        .payment-card.selected {
            border-color: #3b82f6;
            background-color: #f0f6ff;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm p-4">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center">
            <a href="index.html">  <img src="assets/logo.jpg" alt="Logo" class="h-10 w-10 rounded-full"></a>
                <span class="ml-2 text-xl font-bold text-gray-800">GateHub</span>
            </div>
            <div class="flex items-center space-x-8">
                <nav class="flex space-x-6">
                    <a href="personal_information.html" class="text-gray-700 hover:text-blue-600">My Profile</a>
                    <a href="myvehicle.html" class="text-gray-700 hover:text-blue-600">My Vehicle</a>
                    <a href="recharge.html" class="text-gray-700 hover:text-blue-600">My Wallet</a>
                    <a href="pay.html" class="text-gray-700 hover:text-blue-600">Payments</a>
                    <a href="index.html" class="text-gray-700 hover:text-blue-600">Help</a>
                </nav>
                <div class="flex items-center space-x-4">
                <a href="settings.html"> <i class="fas fa-cog text-xl text-gray-600 cursor-pointer hover:text-blue-600"></i></a> <!-- Settings icon -->
                </div>
            </div>
        </div>
    </header>
    <!-- Navigation (Same as previous pages) -->
    
    <main class="container mx-auto px-4 py-8 max-w-md">
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">
                <i class="fas fa-wallet mr-2 text-blue-500"></i>Recharge Account
            </h1>

           <!-- Balance Display -->
<div class="bg-blue-50 rounded-lg p-4 mb-6">
    <p class="text-sm text-gray-600">Current Balance</p>
    <p id="balanceDisplay" class="text-2xl font-bold text-blue-600">$0.00</p>
</div>

            <!-- Recharge Amount -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Recharge Amount
                </label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">$</span>
                    <input type="number" 
                        class="w-full pl-8 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="0.00"
                        step="0.01">
                </div>
            </div>

            <!-- Payment Methods -->
            <div class="mb-8">
                <h3 class="text-sm font-medium text-gray-700 mb-4">
                    Select Payment Method
                </h3>
                
                <div class="grid gap-3">
                    <label class="payment-card cursor-pointer">
                        <div class="flex items-center p-4 rounded-lg">
                            <input type="radio" name="payment-method" class="hidden">
                            <div class="flex items-center w-full">
                                <div class="bg-blue-100 p-2 rounded-lg mr-4">
                                    <i class="fas fa-credit-card text-blue-600 text-xl"></i>
                                </div>
                                <div>
                                    <p class="font-medium text-gray-800">Credit/Debit Card</p>
                                    <p class="text-sm text-gray-600">Visa, Mastercard, Amex</p>
                                </div>
                            </div>
                        </div>
                    </label>

                    <label class="payment-card cursor-pointer">
                        <div class="flex items-center p-4 rounded-lg">
                            <input type="radio" name="payment-method" class="hidden">
                            <div class="flex items-center w-full">
                                <div class="bg-green-100 p-2 rounded-lg mr-4">
                                    <i class="fas fa-mobile-alt text-green-600 text-xl"></i>
                                </div>
                                <div>
                                    <p class="font-medium text-gray-800">Mobile Wallet</p>
                                    <p class="text-sm text-gray-600">Apple Pay, vodafone cash</p>
                                </div>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Confirm Button -->
            <button class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white py-3 rounded-lg
                          hover:from-blue-600 hover:to-blue-700 transition-all font-medium
                          flex items-center justify-center">
                <i class="fas fa-check-circle mr-2"></i>Confirm Recharge
            </button>
        </div>
    </main>
    <script>
       console.log('Token:', localStorage.getItem('token')); // Should show your JWT token
        document.addEventListener('DOMContentLoaded', async () => {
            /// 1. Retrieve token with proper checks
            const tokenString = localStorage.getItem('token');

            if (!tokenString) {
                console.error("No token found - redirecting to login");
                window.location.href = 'login.html';
                return;
            }

            // 2. Parse with error handling
            let tokenObj;
            try {
                tokenObj = JSON.parse(tokenString);
            } catch (e) {
                console.error("Failed to parse token:", e);
                localStorage.removeItem('token');
                window.location.href = 'login.html';
                return;
            }

            // 3. Extract the actual token with validation
        token = tokenObj?.result || tokenObj?.token || tokenObj;     
            
            if (!token || typeof token !== 'string' || !token.startsWith('eyJ')) {
                console.error("Invalid token format:", token);
                localStorage.removeItem('token');
                window.location.href = 'login.html';
                return;
            }

            console.log("Token verified:", token.slice(0, 20) + "..."); // Log partial token
    
            if (!token) return;
    
            // DOM elements
            const amountInput = document.querySelector('input[type="number"]');
            const confirmBtn = document.querySelector('button');
            const balanceElement = document.getElementById('balanceDisplay');
            let currentBalance = 0;
    
            // Error handling (similar to working code)
            function showError(message) {
                alert(`Error: ${message}`);
            }
    
            // Fetch balance (updated with proper error handling)
            async function fetchBalance() {
    try {
        const response = await fetch('https://gatehub.runasp.net/api/VehicleOwner/VOProfile', {
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
            }
        });

        if (!response.ok) throw new Error('Failed to fetch balance');
        
        const data = await response.json();
        
        // Verify the element exists before updating
        const balanceElement = document.getElementById('balanceDisplay');
        if (!balanceElement) {
            throw new Error('Balance display element not found');
        }

        // Update based on actual API response structure
        const balance = data.balance || data.accountBalance || 0.00;
        balanceElement.textContent = `$${balance.toFixed(2)}`;
    } catch (error) {
        console.error('Balance fetch error:', error);
        const balanceElement = document.getElementById('balanceDisplay');
        if (balanceElement) {
            balanceElement.textContent = '$0.00';
        }
        showError('Failed to load balance. Please refresh the page.');
    }
}
    
            // Validation functions
            function validateAmount(value) {
                return !isNaN(value) && value > 0;
            }
    
            function validatePaymentMethod() {
                return document.querySelector('input[name="payment-method"]:checked') !== null;
            }
    
            // Recharge handler (updated with proper error handling)
// Updated handleRecharge function
async function handleRecharge(e) {
    e.preventDefault();
    const amountValue = parseFloat(amountInput.value);
    
    if (!validateAmount(amountValue)) {
        showError('Invalid amount entered');
        return;
    }

    if (!validatePaymentMethod()) {
        showError('Please select payment method');
        return;
    }

    try {
        confirmBtn.disabled = true;
        confirmBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Processing...`;

        const response = await fetch('https://gatehub.runasp.net/api/VehicleOwner/recharge-balance', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                'accept': '*/*'
            },
            body: JSON.stringify({ 
    amount: amountValue,
    returnUrl: window.location.href 
})
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || 'Recharge failed');
        }

        // Handle the payment URL redirect
        if (data.paymentUrl) {
            window.location.href = data.paymentUrl;
        } else {
            throw new Error('No payment URL received from server');
        }

    } catch (error) {
        console.error('Recharge error:', error);
        showError(error.message);
    } finally {
        confirmBtn.disabled = false;
// Before redirecting
confirmBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Redirecting...`;
setTimeout(() => window.location.href = data.paymentUrl, 1000);    }
}
            // Check for payment status in URL parameters
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('payment_status')) {
    if (urlParams.get('payment_status') === 'success') {
        alert('Payment completed successfully!');
        fetchBalance(); // Refresh balance after successful payment
    } else {
        showError('Payment failed or was canceled');
    }
}
    
            // Initialization
            function init() {
                // Payment method selection
                document.querySelectorAll('.payment-card').forEach(card => {
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.payment-card').forEach(c => 
                            c.classList.remove('selected'));
                        card.classList.add('selected');
                        card.querySelector('input[type="radio"]').checked = true;
                    });
                });
    
                // Event listeners
                amountInput.addEventListener('input', () => {
                    amountInput.classList.toggle('border-red-500', !validateAmount(amountInput.value));
                });
    
                confirmBtn.addEventListener('click', handleRecharge);
                
                // Initial balance fetch
                fetchBalance();
            }
    
            init();
        });
    </script>
</body>
</html>
