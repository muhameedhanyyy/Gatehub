        :root {
            --primary: #3b82f6; /* Light blue */

        body {
            font-family: 'Poppins', sans-serif;

            color: var(--text-primary);
            margin: 0;
        }

        .settings-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            padding: 1rem; /* Reduced padding */
        }

        .settings-card:hover {
            transform: translateY(-2px);
        }

        .input-field {
            width: 100%;
            padding: 8px; /* Reduced padding */
            border: 1px solid var(--border-color);
            border-radius: 6px; /* Reduced radius */
            background-color: white;
            color: var(--text-primary);
            font-size: 0.85rem; /* Smaller font size */
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px; /* Reduced width */
            height: 18px; /* Reduced height */
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background-color: var(--border-color);
            border-radius: 18px;
            transition: all 0.3s ease;
        }

        .toggle-slider:before {
            content: '';
            position: absolute;
            height: 14px; /* Reduced size */
            width: 14px; /* Reduced size */
            background-color: white;
            border-radius: 50%;
            top: 50%;
            left: 2px;
            transform: translateY(-50%);
            transition: all 0.3s ease;
        }

        input:checked + .toggle-slider {
            background-color: var(--primary);
        }

        input:checked + .toggle-slider:before {
            transform: translate(18px, -50%);
        }

        .btn-glow {
            display: inline-block;
            padding: 8px 16px; /* Reduced padding */
            background-color: var(--primary);
            color: white;
            font-weight: 500;
            border-radius: 6px; /* Reduced radius */

            transition: all 0.3s ease;

        .btn-glow:hover {
            background-color: var(--secondary);
        }

        .language-select {
            width: 100%;
            padding: 8px; /* Reduced padding */

    if (!tokenString) {
        console.error("No token found - redirecting to login");
        window.location.href = 'login.html';

    }

        token = tokenObj?.result || tokenObj?.token || tokenObj;
        
        // If parsing succeeded but we got null/undefined, treat as invalid
        if (!token) throw new Error("Parsed token is empty");
    } catch (e) {
        // If JSON parse fails, assume it's a raw token string
        token = tokenString;
    }

    // 3. Final validation
    if (!token || typeof token !== 'string') {
        console.error("Invalid token format:", token);
        localStorage.removeItem('token');

    // Remove the JWT prefix check as it might vary

            // Password Update Validation
            const updatePasswordBtn = document.getElementById('update-password-btn');
            const currentPassword = document.getElementById('current-password');
            const newPassword = document.getElementById('new-password');
            const currentPassError = document.getElementById('current-password-error');
            const newPassError = document.getElementById('new-password-error');
        
            updatePasswordBtn.addEventListener('click', (e) => {
                e.preventDefault();
                let isValid = true;
        
                // Reset errors
                currentPassError.classList.add('hidden');
                newPassError.classList.add('hidden');
                currentPassword.classList.remove('border-red-500');
                newPassword.classList.remove('border-red-500');
        
                // Current password validation
                if (currentPassword.value.trim() === '') {
                    currentPassError.textContent = 'Current password is required';
                    currentPassError.classList.remove('hidden');
                    currentPassword.classList.add('border-red-500');
                    isValid = false;
                }
        
                // New password validation
                const newPassValue = newPassword.value.trim();
                if (newPassValue === '') {
                    newPassError.textContent = 'New password is required';
                    newPassError.classList.remove('hidden');
                    newPassword.classList.add('border-red-500');
                    isValid = false;
                } else if (newPassValue.length < 8) {
                    newPassError.textContent = 'Password must be at least 8 characters';
                    newPassError.classList.remove('hidden');
                    newPassword.classList.add('border-red-500');
                    isValid = false;
                } else if (newPassValue === currentPassword.value.trim()) {
                    newPassError.textContent = 'New password must be different from current password';
                    newPassError.classList.remove('hidden');
                    newPassword.classList.add('border-red-500');
                    isValid = false;
                }
        
                if (isValid) {
                    // Simulate API call
                    updatePasswordBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Updating...`;
                    updatePasswordBtn.disabled = true;
                    
                    setTimeout(() => {
                        showToast('success', 'Password updated successfully!');
                        updatePasswordBtn.innerHTML = `<i class="fas fa-save mr-2"></i>Update Password`;
                        updatePasswordBtn.disabled = false;
                        currentPassword.value = '';
                        newPassword.value = '';
                    }, 1500);
                }
            });
        
            // Language Preference Validation
            const languageSelect = document.getElementById('language-select');
            const savePrefBtn = document.getElementById('save-pref-btn');
            
            savePrefBtn.addEventListener('click', (e) => {
                e.preventDefault();
                
                if (languageSelect.value === '') {
                    showToast('error', 'Please select a language');
                    languageSelect.classList.add('border-red-500');
                    return;
                }
                languageSelect.classList.remove('border-red-500');
        
                // Simulate save action
                savePrefBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Saving...`;
                savePrefBtn.disabled = true;
                
                setTimeout(() => {
                    showToast('success', 'Preferences saved successfully!');
                    savePrefBtn.innerHTML = `Save Preferences`;
                    savePrefBtn.disabled = false;
                }, 1000);
            });
        
            // Notification Toggles
            document.querySelectorAll('.toggle-switch input').forEach(toggle => {
                toggle.addEventListener('change', () => {
                    const status = toggle.checked ? 'enabled' : 'disabled';
                    const label = toggle.closest('.flex').querySelector('p').textContent.trim();
                    showToast('success', `${label} ${status}`);
                });
            });
        
            // Toast Notification System
            function showToast(type, message) {
                const toast = document.createElement('div');
                toast.className = `fixed top-4 right-4 px-4 py-3 rounded-lg shadow-lg flex items-center 
                                 ${type === 'success' ? 'bg-green-100 border border-green-400 text-green-700' : 
                                  'bg-red-100 border border-red-400 text-red-700'} 
                                 animate-slide-in z-50`;
                
                toast.innerHTML = `
                    <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i>
                    <span>${message}</span>
                `;
                
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.add('animate-slide-out');
                    setTimeout(() => toast.remove(), 500);
                }, 3000);
            }
        });

            document.getElementById('confirmation-overlay').classList.remove('hidden');
        }

        function confirmSignOut() {
            window.location.href = 'login.html';
        }

        function cancelSignOut() {
            document.getElementById('confirmation-overlay').classList.add('hidden');
        }
        </script>

    // Helper functions
    function clearErrors() {
        document.querySelectorAll('.text-red-500').forEach(el => el.classList.add('hidden'));
        document.getElementById('password-success').classList.add('hidden');
    }
    
    function showError(elementId, message) {
        const errorElement = document.getElementById(elementId);
        errorElement.textContent = message;
        errorElement.classList.remove('hidden');
    }
    
    function showSuccess(message) {
        const successElement = document.getElementById('password-success');
        successElement.textContent = message;
        successElement.classList.remove('hidden');
    }
    
    function clearFields() {
        document.getElementById('current-password').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('confirm-password').value = '';
    }
    
    function handleApiError(error) {
        if (error.errors) {
            Object.entries(error.errors).forEach(([field, messages]) => {
                const errorField = `${field.toLowerCase()}-error`;
                showError(errorField, messages.join(', '));
            });
        } else {
            showError('password-success', error.title || 'Failed to update password');
        }
    }
